# Seuls ${NAMESPACE} et ${APP_BASE_URL} sont substitués à l'installation (envsubst).
# Les autres ${VAR} sont résolues au runtime par RHDH depuis le Secret rhdh-secrets.
kind: ConfigMap
apiVersion: v1
metadata:
  name: app-config-rhdh
  namespace: ${NAMESPACE}
data:
  app-config.yaml: |
    app:
      title: Red Hat Developer Hub
      baseUrl: ${APP_BASE_URL}

    backend:
      auth:
        keys:
          - secret: ${BACKEND_SECRET}
      baseUrl: ${APP_BASE_URL}
      cors:
        origin: ${APP_BASE_URL}

    signInPage: oidc

    auth:
      environment: production
      session:
        secret: ${BACKEND_SECRET}
      # Provider OIDC : configuré dans dynamic-plugins.yaml

    catalog:
      rules:
        - allow: [Component, System, API, Resource, Location, User, Group]
      # Synchro Keycloak : configurée dans dynamic-plugins.yaml

    permission:
      enabled: true
      rbac:
        admin:
          users:
            - name: user:default/admin
        policies-csv-file: /opt/app-root/src/rbac-policy.csv
